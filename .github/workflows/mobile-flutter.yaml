name: mobile-flutter

# Rider app pipeline: static checks + tests on every push/PR, a test APK on
# every push/PR/manual run, installable internal builds on main (signed release
# APK artifact + TestFlight upload), store uploads on rider-v* tags (Play
# internal AAB + TestFlight IPA).
#
# The test APK needs no secrets: it writes no key.properties, so the Gradle
# release buildType falls back to the debug key (see android/app/build.gradle.kts).
# It is for sideloading only -- never for the stores, and its signature differs
# from the release key, so you must uninstall a release build before installing
# it (and vice versa).
#
# Tag convention: push `rider-vX.Y.Z` to ship internal tracks
# (Play internal + TestFlight). Promote to production in the store consoles.
# BUILD_NUMBER is always github.run_number (monotonic); BUILD_NAME is the tag
# version on rider-v* tags and 1.0.0 on main.
on:
  push:
    branches: ['**']
    tags: ['rider-v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  WORKDIR: mobile

jobs:
  check:
    name: analyze + test + theme compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter --version
      - name: Dependencies
        working-directory: ${{ env.WORKDIR }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ env.WORKDIR }}
        run: flutter analyze
      - name: Test
        working-directory: ${{ env.WORKDIR }}
        run: flutter test
      - name: Theme compliance (DESIGN.md hard constraints)
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          echo '-- no FontWeight above 500 --'
          if grep -rn "FontWeight\.w[6-9]" lib test; then exit 1; fi
          echo '-- no gradients --'
          if grep -rn "LinearGradient\|RadialGradient\|SweepGradient" lib test; then exit 1; fi
          echo '-- no letter spacing --'
          if grep -rn "letterSpacing" lib; then exit 1; fi
          echo '-- no hard-coded colors outside tokens.dart --'
          if grep -rn "Color(0x" lib --include="*.dart" | grep -v "theme/tokens.dart"; then exit 1; fi
          echo '-- single font family --'
          test "$(grep -rhoE "fontFamily: [A-Za-z.]+" lib | sort -u | wc -l)" -le 2
          echo OK

  build-test-apk:
    name: test APK (debug key, unsigned for release)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter precache --android
      - name: Build version
        run: |
          echo "BUILD_NAME=1.0.0" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      # Deliberately no signing config and no secrets, so this job also works
      # on pull requests from forks.
      - name: Build release APK (debug key)
        working-directory: ${{ env.WORKDIR }}
        run: >
          flutter build apk --release
          --build-name=${{ env.BUILD_NAME }}
          --build-number=${{ env.BUILD_NUMBER }}
          --dart-define API_BASE_URL=${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          --dart-define ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          --dart-define LOCATION_UPDATE_INTERVAL_MINUTES=${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}
      - name: Report the signer
        run: |
          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs \
              mobile/build/app/outputs/flutter-apk/app-release.apk \
              | grep -i "certificate DN" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rider-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-android:
    name: internal APK (release)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter precache --android
      - name: Build version
        run: |
          echo "BUILD_NAME=1.0.0" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64/ANDROID_KEY_ALIAS not set; APK will be signed with the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rider.jks"
          keytool -list -keystore "$RUNNER_TEMP/rider.jks" \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 does not decode to a keystore readable with ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS (encode with: base64 -i rider.jks | tr -d '\\n')"; exit 1; }
          cat > mobile/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/rider.jks
          EOF
      - name: Build release APK
        working-directory: ${{ env.WORKDIR }}
        run: >
          flutter build apk --release
          --build-name=${{ env.BUILD_NAME }}
          --build-number=${{ env.BUILD_NUMBER }}
          --dart-define API_BASE_URL=${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          --dart-define ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          --dart-define LOCATION_UPDATE_INTERVAL_MINUTES=${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}
      - uses: actions/upload-artifact@v4
        with:
          name: rider-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  release-android:
    name: Play internal track
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/rider-v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter precache --android
      - name: Install fastlane
        run: gem install fastlane -N
      - name: Build version
        run: |
          echo "BUILD_NAME=${GITHUB_REF_NAME#rider-v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rider.jks"
          keytool -list -keystore "$RUNNER_TEMP/rider.jks" \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 does not decode to a keystore readable with ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS (encode with: base64 -i rider.jks | tr -d '\\n')"; exit 1; }
          cat > mobile/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/rider.jks
          EOF
      - name: Build + upload (internal track)
        working-directory: mobile/android
        env:
          RIDER_API_BASE_URL: ${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          LOCATION_UPDATE_INTERVAL_MINUTES: ${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          BUILD_NAME: ${{ env.BUILD_NAME }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: fastlane internal

  release-ios:
    name: TestFlight
    runs-on: macos-latest
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rider-v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - name: Check signing secrets
        id: secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROFILE_BASE64 IOS_PROFILE_NAME; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/rider-v* ]]; then
            echo "::error::Missing iOS secrets:$missing"; exit 1
          else
            echo "::warning::Skipping TestFlight upload; missing iOS secrets:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        run: flutter precache --ios
      - name: Install fastlane
        if: steps.secrets.outputs.ok == 'true'
        run: gem install fastlane -N
      - name: Build version
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/rider-v* ]]; then
            echo "BUILD_NAME=${GITHUB_REF_NAME#rider-v}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=1.0.0" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build + upload (TestFlight)
        if: steps.secrets.outputs.ok == 'true'
        working-directory: mobile/ios
        env:
          RIDER_API_BASE_URL: ${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          LOCATION_UPDATE_INTERVAL_MINUTES: ${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}
          BUILD_NAME: ${{ env.BUILD_NAME }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: fastlane beta
