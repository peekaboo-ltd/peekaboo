name: mobile-flutter

# Rider app pipeline: static checks + tests on every push/PR, installable
# internal builds on main, store uploads on rider-v* tags.
#
# Tag convention: push `rider-vX.Y.Z` to ship internal tracks
# (Play internal + TestFlight). Promote to production in the store consoles.
on:
  push:
    branches: ['**']
    tags: ['rider-v*']
  pull_request:

env:
  FLUTTER_VERSION: '3.47.6'
  WORKDIR: mobile_flutter

jobs:
  check:
    name: analyze + test + theme compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter --version
      - name: Dependencies
        working-directory: ${{ env.WORKDIR }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ env.WORKDIR }}
        run: flutter analyze
      - name: Test
        working-directory: ${{ env.WORKDIR }}
        run: flutter test
      - name: Theme compliance (DESIGN.md hard constraints)
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          echo '-- no FontWeight above 500 --'
          if grep -rn "FontWeight\.w[6-9]" lib test; then exit 1; fi
          echo '-- no gradients --'
          if grep -rn "LinearGradient\|RadialGradient\|SweepGradient" lib test; then exit 1; fi
          echo '-- no letter spacing --'
          if grep -rn "letterSpacing" lib; then exit 1; fi
          echo '-- no hard-coded colors outside tokens.dart --'
          if grep -rn "Color(0x" lib --include="*.dart" | grep -v "theme/tokens.dart"; then exit 1; fi
          echo '-- single font family --'
          test "$(grep -rhoE "fontFamily: [A-Za-z.]+" lib | sort -u | wc -l)" -le 2
          echo OK

  build-android:
    name: internal APK (debug)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rider-v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter precache --android
      - name: Build debug APK
        working-directory: ${{ env.WORKDIR }}
        run: >
          flutter build apk --debug
          --dart-define API_BASE_URL=${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          --dart-define ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          --dart-define LOCATION_UPDATE_INTERVAL_MINUTES=${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}
      - uses: actions/upload-artifact@v4
        with:
          name: rider-debug-apk
          path: mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: iOS compile check (no codesign)
    runs-on: macos-latest
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rider-v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter precache --ios
      - name: Build iOS (no codesign)
        working-directory: ${{ env.WORKDIR }}
        run: >
          flutter build ios --no-codesign --debug
          --dart-define API_BASE_URL=${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          --dart-define ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          --dart-define LOCATION_UPDATE_INTERVAL_MINUTES=${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}

  release-android:
    name: Play internal track
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/rider-v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter precache --android
      - name: Install fastlane
        run: gem install fastlane -N
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rider.jks"
          cat > mobile_flutter/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/rider.jks
          EOF
      - name: Build + upload (internal track)
        working-directory: mobile_flutter/android
        env:
          RIDER_API_BASE_URL: ${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          LOCATION_UPDATE_INTERVAL_MINUTES: ${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
        run: fastlane internal

  release-ios:
    name: TestFlight
    runs-on: macos-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/rider-v')
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter precache --ios
      - name: Install fastlane
        run: gem install fastlane -N
      - name: Build + upload (TestFlight)
        working-directory: mobile_flutter/ios
        env:
          RIDER_API_BASE_URL: ${{ secrets.RIDER_API_BASE_URL || 'https://server.peekaboo.co.rw/api/v1' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID || '276e86c4-5af1-4ad2-ba8a-20908c155564' }}
          LOCATION_UPDATE_INTERVAL_MINUTES: ${{ vars.LOCATION_UPDATE_INTERVAL_MINUTES || '5' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: fastlane beta
